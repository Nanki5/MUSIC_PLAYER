services:
  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public
      - ./src:/var/www/html/src
    depends_on:
      php:
        condition: service_started
      minio:
        condition: service_started

  php:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      JWT_SECRET: "${JWT_SECRET:-devsecret}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost:5500,http://localhost:8000}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-http://localhost:8000}"
      DB_HOST: "${DB_HOST:-db}"
      DB_PORT: "${DB_PORT:-5432}"
      DB_NAME: "${DB_NAME:-music}"
      DB_USER: "${DB_USER:-music}"
      DB_PASSWORD: "${DB_PASSWORD:-music}"
      MINIO_ENDPOINT: "${MINIO_ENDPOINT:-http://minio:9000}"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-minioadmin}"
      MINIO_BUCKET: "${MINIO_BUCKET:-music}"
    volumes:
      - ./public:/var/www/html/public
      - ./src:/var/www/html/src
      - ./seed.php:/var/www/html/seed.php:ro
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${DB_NAME:-music}"
      POSTGRES_USER: "${DB_USER:-music}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-music}"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: bitnamilegacy/minio:latest
    user: "0:0"
    command: server /data --console-address :9001
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY:-minioadmin}"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  pgdata:
  minio-data:
