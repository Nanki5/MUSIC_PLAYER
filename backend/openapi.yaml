openapi: 3.1.0
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
info:
  title: Music Player API
  version: 1.0.0
  description: |
    REST/JSON API for the Music Player backend (vanilla PHP + PostgreSQL + MinIO).

    ## Authentication
    Authentication is a stateless HS256 JWT stored in the persistent `auth` cookie
    (`HttpOnly`, `SameSite=None`, `Max-Age` 30 days, `Secure` outside localhost).
    Register and login set the cookie; logout and account deletion clear it.
    Protected endpoints verify on every request that the user still exists.

    ## CSRF / Origin checks
    Every state-changing request (`POST`, `PATCH`, `DELETE`) must send an `Origin`
    or `Referer` header whose origin is listed in `ALLOWED_ORIGINS`, otherwise the
    API responds `403 Forbidden`. Browsers set these headers automatically; API
    clients must set one explicitly (see the `Origin` header parameter).

    ## CORS
    `Access-Control-Allow-Credentials: true` is always sent; the origin is echoed
    only when it is in the `ALLOWED_ORIGINS` allowlist. Preflight `OPTIONS`
    requests return `204` without a body.

    ## Errors
    Errors are JSON objects of the form `{"error": "<message>"}`. Relevant status
    codes are `401` (not authenticated), `403` (CSRF/origin rejected), `404`
    (missing resource, including private playlists), `409` (conflict), `413`
    (payload/file too large), `415` (unsupported media type), `422` (validation)
    and `500` (server/storage failure). Successful deletes and logout return `204`.

    ## Pagination
    List endpoints accept `limit` (default `20`, max `100`) and `offset`
    (default `0`). Invalid values return `422`.

    ## Media
    `audio_url`, `cover_url` and `picture_url` are absolute URLs pointing at
    `PUBLIC_BASE_URL + /media/...`. Media is served by nginx from the public-read
    MinIO bucket, supports `Range` requests (`206`), and is not part of the PHP
    JSON API (errors are MinIO's, not `{"error": ...}`).

    ## Uploads
    Uploads use `multipart/form-data`. Audio: `mp3`, `flac`, `ogg`, `m4a` up to
    50 MB. Images: `jpg`, `png`, `webp` up to 5 MB. Both the file extension and
    the detected MIME type are validated.
servers:
  - url: http://localhost:8000
    description: Local docker-compose stack (nginx)
tags:
  - name: Auth
    description: Registration, login, session and account management.
  - name: Songs
    description: Song listing and upload.
  - name: Likes
    description: Liking songs and listing the current user's likes.
  - name: Playlists
    description: Playlist creation, management and song membership.
  - name: Media
    description: Binary media served by nginx from MinIO (not JSON).
security:
  - cookieAuth: []
paths:
  /api/auth/register:
    post:
      tags: [Auth]
      operationId: registerUser
      summary: Create an account
      description: |
        Creates a user, signs them in and sets the `auth` cookie.
        `login` must match `^[a-zA-Z0-9_.]{3,50}$`; `password` must be 8-72 bytes.
      security: []
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
            example:
              login: alice
              password: correct-horse
      responses:
        '201':
          description: Account created and signed in.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/AuthCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              example:
                login: alice
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: The login is already taken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Login already taken
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/auth/login:
    post:
      tags: [Auth]
      operationId: loginUser
      summary: Sign in
      description: Verifies the credentials and sets the `auth` cookie.
      security: []
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
            example:
              login: alice
              password: correct-horse
      responses:
        '200':
          description: Signed in.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/AuthCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              example:
                login: alice
        '401':
          description: Invalid credentials (also returned when `login` or `password` is missing/not a string).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Invalid credentials
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Sign out
      description: Clears the `auth` cookie. Does not require an authenticated session.
      security: []
      parameters:
        - $ref: '#/components/parameters/Origin'
      responses:
        '204':
          description: Cookie cleared; no body.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearedAuthCookie'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/auth/account:
    delete:
      tags: [Auth]
      operationId: deleteAccount
      summary: Delete the current account
      description: |
        Permanently deletes the authenticated user. Songs, likes and playlists
        are removed by database cascade. The user's non-default MinIO objects
        (`song/{id}`, `cover/{songId}`, `playlistPicture/{playlistId}`) are
        deleted; shared `cover/default` and `playlistPicture/default` are kept.
        The `auth` cookie is cleared.
      parameters:
        - $ref: '#/components/parameters/Origin'
      responses:
        '204':
          description: Account deleted; no body.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearedAuthCookie'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Get the current user
      responses:
        '200':
          description: The authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              example:
                login: alice
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/songs:
    get:
      tags: [Songs]
      operationId: listSongs
      summary: List songs
      description: |
        Public song catalog. `query` filters case-insensitively on title OR author.
        Results are always sorted descending (tie-break `id` descending):
        `uploaded_at` (default) or `like_count` when `sort=likes`.
      security: []
      parameters:
        - name: query
          in: query
          required: false
          description: Case-insensitive substring matched against title or author.
          schema:
            type: string
            default: ''
          example: midnight
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [uploaded_at, likes]
            default: uploaded_at
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A page of songs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Song'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Songs]
      operationId: uploadSong
      summary: Upload a song
      description: |
        Uploads a song with an optional cover. The cover defaults to the shared
        `cover/default` object. On storage failure the database row and any
        already-stored objects are rolled back and `500` is returned.
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [title, author, file]
              properties:
                title:
                  type: string
                  maxLength: 100
                  description: Trimmed, non-empty.
                author:
                  type: string
                  maxLength: 100
                  description: Trimmed, non-empty.
                file:
                  type: string
                  contentMediaType: application/octet-stream
                  description: |
                    Audio file (`mp3`, `flac`, `ogg`, `m4a`), max 50 MB.
                    Accepted media types: `audio/mpeg`, `audio/flac`, `audio/ogg`, `audio/mp4`.
                cover:
                  type: string
                  contentMediaType: application/octet-stream
                  description: |
                    Optional image (`jpg`, `png`, `webp`), max 5 MB.
                    Accepted media types: `image/jpeg`, `image/png`, `image/webp`.
            encoding:
              file:
                contentType: audio/mpeg, audio/flac, audio/ogg, audio/mp4
              cover:
                contentType: image/jpeg, image/png, image/webp
      responses:
        '201':
          description: Song created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Song'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: Audio/cover too large, or the request body exceeded the upload limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                fileTooLarge:
                  value:
                    error: File too large
                payloadTooLarge:
                  value:
                    error: Payload Too Large
        '415':
          description: Unsupported audio/image type (extension or detected MIME rejected).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Unsupported media type
        '422':
          description: Missing or invalid `title`/`author`, missing audio file, or failed upload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidTitle:
                  value:
                    error: Invalid title
                missingAudio:
                  value:
                    error: Audio file required
                invalidUpload:
                  value:
                    error: Invalid upload
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/songs/{id}/like:
    post:
      tags: [Likes]
      operationId: toggleSongLike
      summary: Toggle a like on a song
      description: Adds the like if absent, removes it if present.
      parameters:
        - $ref: '#/components/parameters/SongId'
        - $ref: '#/components/parameters/Origin'
      responses:
        '200':
          description: The new like state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LikeToggle'
              example:
                liked: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: The path id is not a positive integer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Invalid song id
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/me/likes:
    get:
      tags: [Likes]
      operationId: listLikedSongs
      summary: List the current user's liked songs
      description: Ordered by `liked_at` descending, tie-break `song_id` descending.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A page of liked songs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LikedSong'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/playlists:
    post:
      tags: [Playlists]
      operationId: createPlaylist
      summary: Create a playlist
      description: |
        Creates a playlist owned by the authenticated user. New playlists are
        private (`published: false`; only a database admin/seed can publish).
        Song order is preserved as 0-based positions. Unknown or duplicate song
        ids are rejected with `422`.
      parameters:
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, songs]
              properties:
                name:
                  type: string
                  maxLength: 100
                  description: Trimmed, non-empty playlist name.
                songs:
                  type: string
                  description: |
                    JSON-encoded array of existing song ids. Required; use `[]`
                    for an empty playlist. Order is preserved. Duplicates and
                    unknown ids are rejected.
                  example: '[12, 7, 31]'
                picture:
                  type: string
                  contentMediaType: application/octet-stream
                  description: |
                    Optional image (`jpg`, `png`, `webp`), max 5 MB. Defaults to
                    the shared `playlistPicture/default`. Accepted media types:
                    `image/jpeg`, `image/png`, `image/webp`.
            encoding:
              picture:
                contentType: image/jpeg, image/png, image/webp
      responses:
        '201':
          description: Playlist created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playlist'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: Picture too large, or the request body exceeded the upload limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: File too large
        '415':
          description: Unsupported picture type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Unsupported media type
        '422':
          description: Invalid `name`, missing/non-JSON `songs`, unknown/duplicate song id, or invalid upload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidName:
                  value:
                    error: Invalid name
                invalidSongs:
                  value:
                    error: Invalid songs
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/playlists/{id}:
    get:
      tags: [Playlists]
      operationId: getPlaylist
      summary: Get a playlist
      description: |
        Returns the playlist with its songs ordered by `position` ascending.
        Unpublished playlists are visible only to their owner; everyone else
        (including anonymous callers) gets `404`, not `403`, to avoid leaking
        existence.
      security:
        - {}
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/PlaylistId'
      responses:
        '200':
          description: The playlist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playlist'
        '404':
          description: Playlist not found, or unpublished and not owned by the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Not Found
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [Playlists]
      operationId: renamePlaylist
      summary: Rename a playlist
      description: Owner only. Renames the playlist without touching its songs or picture.
      parameters:
        - $ref: '#/components/parameters/PlaylistId'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 100
                  description: Trimmed, non-empty.
            example:
              name: Late night drive
      responses:
        '200':
          description: Updated playlist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playlist'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Missing or invalid `name`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Invalid name
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Playlists]
      operationId: deletePlaylist
      summary: Delete a playlist
      description: |
        Owner only. Deletes the playlist and its `playlist_songs` rows. The
        custom `playlistPicture/{playlistId}` object is deleted unless the
        playlist still points at the shared default.
      parameters:
        - $ref: '#/components/parameters/PlaylistId'
        - $ref: '#/components/parameters/Origin'
      responses:
        '204':
          description: Playlist deleted; no body.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/playlists/{id}/picture:
    patch:
      tags: [Playlists]
      operationId: changePlaylistPicture
      summary: Change a playlist picture
      description: |
        Owner only. Uses `multipart/form-data` (the router parses multipart
        bodies for `PATCH`). The object at `playlistPicture/{playlistId}` is
        overwritten first; on storage failure the old object remains and `500`
        is returned.
      parameters:
        - $ref: '#/components/parameters/PlaylistId'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [picture]
              properties:
                picture:
                  type: string
                  contentMediaType: application/octet-stream
                  description: |
                    Image (`jpg`, `png`, `webp`), max 5 MB.
                    Accepted media types: `image/jpeg`, `image/png`, `image/webp`.
            encoding:
              picture:
                contentType: image/jpeg, image/png, image/webp
      responses:
        '200':
          description: Updated playlist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playlist'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: Picture too large, or the request body exceeded the upload limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: File too large
        '415':
          description: Unsupported picture type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Unsupported media type
        '422':
          description: No picture supplied or the upload failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidPicture:
                  value:
                    error: Invalid picture
                invalidUpload:
                  value:
                    error: Invalid upload
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/me/playlists:
    get:
      tags: [Playlists]
      operationId: listMyPlaylists
      summary: List the current user's playlists
      description: Returns playlist metadata (no songs), ordered by `id` descending. Not paginated.
      responses:
        '200':
          description: All playlists owned by the authenticated user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlaylistMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/playlists/{id}/songs/{songId}:
    post:
      tags: [Playlists]
      operationId: togglePlaylistSong
      summary: Add or remove a song from a playlist
      description: |
        Owner only. Toggles membership: adds the song at `max(position) + 1`
        if absent, removes it if present. Removal leaves gaps in positions (no
        renumbering). Non-owners get `404`.
      parameters:
        - $ref: '#/components/parameters/PlaylistId'
        - $ref: '#/components/parameters/PathSongId'
        - $ref: '#/components/parameters/Origin'
      responses:
        '200':
          description: The new membership state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistSongToggle'
              example:
                added: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: The song id in the path is not a positive integer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Invalid song id
        '500':
          $ref: '#/components/responses/InternalServerError'
  /media/song/{id}:
    get:
      tags: [Media]
      operationId: getSongAudio
      summary: Download/stream song audio
      description: |
        Served by nginx, proxied to the public-read MinIO bucket at `song/{id}`.
        Supports `Range` requests (`206 Partial Content`) and `If-Range`.
        Errors come from MinIO and are not JSON. The response carries
        `X-Content-Type-Options: nosniff`.
      security: []
      parameters:
        - $ref: '#/components/parameters/MediaId'
        - name: Range
          in: header
          required: false
          description: Standard HTTP byte range, e.g. `bytes=0-1023`.
          schema:
            type: string
        - name: If-Range
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Full media object.
          headers:
            X-Content-Type-Options:
              $ref: '#/components/headers/NoSniff'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/MediaCors'
          content:
            audio/mpeg:
              schema:
                type: string
                contentMediaType: audio/mpeg
            audio/flac:
              schema:
                type: string
                contentMediaType: audio/flac
            audio/ogg:
              schema:
                type: string
                contentMediaType: audio/ogg
            audio/mp4:
              schema:
                type: string
                contentMediaType: audio/mp4
            application/octet-stream:
              schema:
                type: string
                contentMediaType: application/octet-stream
        '206':
          description: Partial content for a `Range` request.
          headers:
            Content-Range:
              description: Returned byte range, e.g. `bytes 0-1023/4096`.
              schema:
                type: string
            Accept-Ranges:
              schema:
                type: string
                example: bytes
            X-Content-Type-Options:
              $ref: '#/components/headers/NoSniff'
          content:
            application/octet-stream:
              schema:
                type: string
                contentMediaType: application/octet-stream
        '404':
          description: Object does not exist (MinIO error body).
        '416':
          description: Requested range is not satisfiable.
  /media/cover/{id}:
    get:
      tags: [Media]
      operationId: getSongCover
      summary: Get a song cover image
      description: Served by nginx from the public-read MinIO bucket at `cover/{id}`.
      security: []
      parameters:
        - $ref: '#/components/parameters/MediaId'
      responses:
        '200':
          description: Cover image.
          headers:
            X-Content-Type-Options:
              $ref: '#/components/headers/NoSniff'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/MediaCors'
          content:
            image/jpeg:
              schema:
                type: string
                contentMediaType: image/jpeg
            image/png:
              schema:
                type: string
                contentMediaType: image/png
            image/webp:
              schema:
                type: string
                contentMediaType: image/webp
            application/octet-stream:
              schema:
                type: string
                contentMediaType: application/octet-stream
        '404':
          description: Object does not exist (MinIO error body).
  /media/playlistPicture/{id}:
    get:
      tags: [Media]
      operationId: getPlaylistPicture
      summary: Get a playlist picture
      description: Served by nginx from the public-read MinIO bucket at `playlistPicture/{id}`.
      security: []
      parameters:
        - $ref: '#/components/parameters/MediaId'
      responses:
        '200':
          description: Playlist picture.
          headers:
            X-Content-Type-Options:
              $ref: '#/components/headers/NoSniff'
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/MediaCors'
          content:
            image/jpeg:
              schema:
                type: string
                contentMediaType: image/jpeg
            image/png:
              schema:
                type: string
                contentMediaType: image/png
            image/webp:
              schema:
                type: string
                contentMediaType: image/webp
            application/octet-stream:
              schema:
                type: string
                contentMediaType: application/octet-stream
        '404':
          description: Object does not exist (MinIO error body).
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: auth
      description: |
        HS256 JWT (`{"user_id": <id>}`) issued by register/login, valid for 30
        days. The server re-checks that the user still exists on every request.
  parameters:
    Origin:
      name: Origin
      in: header
      required: false
      description: |
        Required for `POST`/`PATCH`/`DELETE` when no `Referer` is sent. Must
        match one of `ALLOWED_ORIGINS`, otherwise `403 Forbidden`. Browsers set
        this automatically.
      schema:
        type: string
        format: uri
      example: http://localhost:5500
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return (1-100).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      required: false
      description: Number of items to skip (0 or greater).
      schema:
        type: integer
        minimum: 0
        default: 0
    SongId:
      name: id
      in: path
      required: true
      description: Positive song id.
      schema:
        type: integer
        minimum: 1
        format: int64
      example: 42
    PathSongId:
      name: songId
      in: path
      required: true
      description: Positive song id.
      schema:
        type: integer
        minimum: 1
        format: int64
      example: 42
    PlaylistId:
      name: id
      in: path
      required: true
      description: Positive playlist id.
      schema:
        type: integer
        minimum: 1
        format: int64
      example: 7
    MediaId:
      name: id
      in: path
      required: true
      description: Object id (the parent entity's id; use `default` for the seeded fallback objects).
      schema:
        type: string
      example: '42'
  headers:
    AuthCookie:
      description: |
        Sets the `auth` cookie to a signed JWT: `Max-Age=2592000; Path=/;
        HttpOnly; SameSite=None` plus `Secure` when not on localhost.
      schema:
        type: string
        example: auth=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...; Max-Age=2592000; Path=/; HttpOnly; SameSite=None
    ClearedAuthCookie:
      description: Clears the `auth` cookie (`auth=; Max-Age=0`).
      schema:
        type: string
        example: auth=; Max-Age=0; Path=/; HttpOnly; SameSite=None
    NoSniff:
      description: Prevents MIME sniffing of media responses.
      schema:
        type: string
        example: nosniff
    MediaCors:
      description: Echoed when the request origin is in the `ALLOWED_ORIGINS` allowlist.
      schema:
        type: string
        example: http://localhost:5500
  responses:
    Unauthorized:
      description: Missing, invalid or expired `auth` cookie, or the user no longer exists.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Unauthorized
    Forbidden:
      description: CSRF/origin check failed (Origin/Referer missing or not in `ALLOWED_ORIGINS`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Forbidden
    NotFound:
      description: Resource not found. Also returned instead of `403` for resources the caller may not see (e.g. another user's private playlist).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Not Found
    ValidationError:
      description: Invalid query/body value. The `error` message names the offending field.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidLimit:
              value:
                error: Invalid limit
            invalidOffset:
              value:
                error: Invalid offset
            invalidSort:
              value:
                error: Invalid sort
    InternalServerError:
      description: Unexpected server or object-storage failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Internal Server Error
  schemas:
    Credentials:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          pattern: '^[a-zA-Z0-9_.]{3,50}$'
          description: 3-50 characters; letters, digits, underscore or dot.
          example: alice
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: 8-72 bytes.
          example: correct-horse
    Session:
      type: object
      required: [login]
      properties:
        login:
          type: string
          example: alice
    Song:
      type: object
      required: [id, title, author, audio_url, cover_url, uploaded_at, like_count]
      properties:
        id:
          type: integer
          format: int64
          example: 42
        title:
          type: string
          example: Midnight Drive
        author:
          type: string
          example: Neon Coast
        audio_url:
          type: string
          format: uri
          description: Absolute URL to `/media/song/{id}`.
          example: http://localhost:8000/media/song/42
        cover_url:
          type: string
          format: uri
          description: Absolute URL to `/media/cover/{id}`; never null (defaults to `cover/default`).
          example: http://localhost:8000/media/cover/42
        uploaded_at:
          type: string
          description: PostgreSQL `timestamptz` serialized as text.
          example: '2026-10-30 12:34:56+00'
        like_count:
          type: integer
          minimum: 0
          description: Number of likes; `0` when not computed.
          example: 12
    LikedSong:
      allOf:
        - $ref: '#/components/schemas/Song'
        - type: object
          required: [liked_at]
          properties:
            liked_at:
              type: string
              description: PostgreSQL `timestamptz` serialized as text.
              example: '2026-10-30 13:00:00+00'
    PlaylistSong:
      allOf:
        - $ref: '#/components/schemas/Song'
        - type: object
          required: [position]
          properties:
            position:
              type: integer
              minimum: 0
              description: 0-based position within the playlist; gaps can appear after removals.
              example: 0
    Playlist:
      type: object
      required: [id, name, published, picture_url, songs]
      properties:
        id:
          type: integer
          format: int64
          example: 7
        name:
          type: string
          example: Late night drive
        published:
          type: boolean
          description: Only a database admin/seed can publish; new playlists are private.
          example: false
        picture_url:
          type: string
          format: uri
          description: Absolute URL to `/media/playlistPicture/{id}`; never null (defaults to the shared default).
          example: http://localhost:8000/media/playlistPicture/7
        songs:
          type: array
          description: Songs ordered by `position` ascending.
          items:
            $ref: '#/components/schemas/PlaylistSong'
    PlaylistMeta:
      type: object
      required: [id, name, published, picture_url]
      properties:
        id:
          type: integer
          format: int64
          example: 7
        name:
          type: string
          example: Late night drive
        published:
          type: boolean
          example: false
        picture_url:
          type: string
          format: uri
          example: http://localhost:8000/media/playlistPicture/7
    LikeToggle:
      type: object
      required: [liked]
      properties:
        liked:
          type: boolean
          description: '`true` if the song is now liked, `false` if the like was removed.'
          example: true
    PlaylistSongToggle:
      type: object
      required: [added]
      properties:
        added:
          type: boolean
          description: '`true` if the song was added, `false` if it was removed.'
          example: true
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: Not Found
