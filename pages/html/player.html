<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>player</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@400..800&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="../../CSS/main.css">
<body>
 <div class="player__content">
    <div class="player__top-bar">
        <span class="material-symbols-rounded">expand_content</span>
        <span>Now playing</span>
        <span class="material-symbols-rounded">more_horiz</span>
    </div>
    <div class="player__image-wrapper">
        <div class="player__music-image">
            <img src="../../assets/images/images.png" alt="">
        </div>
    </div>
    <div class="player__music-titles">
        <p class="player__name">Live is life - Opus</p>
        <p class="player__artist">Opus</p>
    </div>
    <div class="player__progress-details">
        <div class="player__progress-bar">
            <span></span>
        </div>
        <div class="player__time">
            <span class="current">0:00</span>
            <span class="final">5:30</span>
        </div>
    </div>
    <div class="player__control-button">
        <span class="material-symbols-rounded" id="repeat">repeat</span>
        <span class="material-symbols-rounded" id="previous">skip_previous</span>
        <div class="player__play-pause">
            <span class="material-symbols-rounded">play_arrow</span>
        </div>
        <span class="material-symbols-rounded" id="next">skip_next</span>
        <span class="material-symbols-rounded" id="shuffle">shuffle</span>
    </div>
</div>
    <audio src="../../assets/audio/Opus - Live is life.mp3" class="player__main-song"></audio>
    <script src="playlist.js"></script>
    <script src="musicplayerscript.js"></script>
</body>
</html>
